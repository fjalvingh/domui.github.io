# Variables the documentation uses as ${name}, one 'name=value' per line.
# The value is the rest of the line, taken exactly as it is written; '#' starts
# a comment line. A definition can be overridden for a single build with
# '-Dname=value' on the generator's command line.

# The base url of the running demo application: where the pages that '!demo()'
# tags embed are served from, and what ${demo} expands to in a link.
demo=https://demo.domui.org/
